<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F8FC" />
    <meta
      name="description"
      content="Seu treino A/B/C, organizado para 3, 4 ou 5 dias. Veja os exercícios, acompanhe as séries e encontre seu ritmo."
    />
    <title>Ritmo · Seu treino de hoje</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="preload"
      href="./assets/body.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Ir para o conteúdo</a>
    <div id="app">
      <main class="loading">
        <span class="brand">ritmo<span>✳</span></span>
        <p>Preparando seu treino…</p>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="exercise-dialog" aria-labelledby="exercise-title"></dialog>
    <dialog id="info-dialog" aria-labelledby="info-title"></dialog>
    <div id="timer" hidden></div>
    <noscript
      >Ative o JavaScript no navegador para escolher sua agenda e acompanhar os
      exercícios.</noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
